<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet">
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen">
  </head>
  <body class ="body">
    <header class="header">
      <img 
        src="./eisenhower-matrix.jpg" 
        class="header__img"
        alt="Eisenhower Matrix">
      <a 
        class="header__more-inf" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <div class="new-task">
        <label for="new-task" class="label new-task__label">Add Item</label>
        <div class="new-task__input-container">
          <input 
            id="new-task"
            class="input task" 
            type="text">
          <button 
            class="btn"
            aria-label="Add new task">
            Add</button>
        </div>
      </div>
      <h3 class="main__title">Todo</h3>
      <ul id="incomplete-tasks" class="tasks-list">
        <li class="tasks-list__item">
          <input type="checkbox" class="input">
          <label class="label task">Pay Bills</label>
          <input 
            type="text" 
            class="input task">
          <button 
            class="btn edit"
            aria-label="Edit task">
            Edit</button>
          <button class="btn delete">
            <img 
              src="./remove.svg" 
              class="btn__img-delete" 
              alt="Delete button">
          </button>
        </li>
        <li class="tasks-list__item edit-mode">
          <input type="checkbox" class="input">
          <label class="label task">Go Shopping</label>
          <input 
            type="text" 
            value="Go Shopping" 
            class="input task">
          <button 
            class="btn edit"
            aria-label="Edit task">
            Save</button>
          <button class="btn delete">
            <img 
              src="./remove.svg" 
              class="btn__img-delete" 
              alt="Delete button">
          </button>
        </li>
      </ul>
      <h3 class="main__title">Completed</h3>
      <ul id="completed-tasks" class="tasks-list">
        <li class = "tasks-list__item">
          <input type="checkbox" class="input" checked>
          <label class="label task">See the Doctor</label>
          <input 
            type="text" 
            class="input task">
          <button 
            class="btn edit"
            aria-label="Edit task">
            Edit</button>
          <button class="btn delete">
            <img 
              src="./remove.svg" 
              class="btn__img-delete" 
              alt="Delete button">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
